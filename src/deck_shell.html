<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nour Serhan · Portfolio</title>
<meta name="description" content="Nour Serhan: brand strategist, art director and graphic designer in Lisbon. Founder of Think Milk.">
<style>
/* One slide per project. Black & white frame, the work carries the colour. */
/*FONTS*/
:root{--ink:#0c0c0b;--paper:#f6f5f2;--mute:#6a6964;--line:#d9d7d1;--panel:#e7e6e1;--dim:#9f9d96;
  --display:"Adventor","Avant Garde","Century Gothic","Futura",system-ui,sans-serif;--text:"Lora",Georgia,serif;
  --gut:clamp(16px,2.6vw,40px);--bar:58px;color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
html{scroll-snap-type:y mandatory;scroll-padding-top:0;-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.5 var(--text);-webkit-font-smoothing:antialiased;overflow-x:hidden}
img,video{display:block;max-width:100%}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid #e8e6e0;outline-offset:2px;box-shadow:0 0 0 4px var(--ink)}
.kick{font:700 11px/1.3 var(--display);letter-spacing:.16em;text-transform:uppercase;margin:0 0 10px;color:var(--mute)}

/* top bar */
.bar{position:fixed;inset:0 0 auto 0;z-index:30;height:var(--bar);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 var(--gut);background:var(--ink);color:#f3f2ee}
.brand{font:700 17px/1 var(--display);letter-spacing:-.02em;text-decoration:none;white-space:nowrap}
#menu{list-style:none;margin:0;padding:0;display:flex;align-items:center;gap:clamp(14px,2vw,30px);font:400 14.5px/1 var(--display)}
#menu>li>a,.dd-btn{text-decoration:none;background:none;border:0;padding:8px 0;cursor:pointer;white-space:nowrap}
#menu a:hover,.dd-btn:hover{opacity:.7}
#menu .hl{border-bottom:1.5px solid currentColor}
.dd{position:relative}
.dd-btn::after{content:"";display:inline-block;width:6px;height:6px;border-right:1.5px solid;border-bottom:1.5px solid;transform:rotate(45deg) translate(-2px,-2px);margin-left:8px}
.dd-list{list-style:none;margin:0;padding:10px 0;position:absolute;right:0;top:calc(100% + 12px);min-width:260px;background:var(--ink);display:none;box-shadow:0 20px 40px rgba(0,0,0,.25)}
.dd-btn[aria-expanded="true"]+.dd-list{display:block}
.dd-list a{display:block;padding:9px 20px;text-decoration:none;text-align:right;font-size:15px}
.dd-list a:hover{background:#262624}
.bar-r{display:flex;align-items:center;gap:14px}
.ibtn{background:none;border:1px solid #4a4945;color:#f3f2ee;height:34px;padding:0 14px;border-radius:99px;cursor:pointer;font:400 13px/1 var(--display);white-space:nowrap}
.ibtn:hover{border-color:#f3f2ee}
#burger{display:none}
@media (max-width:980px){
  #burger{display:inline-block}
  #menu{position:fixed;inset:var(--bar) 0 auto 0;max-height:calc(100svh - var(--bar));overflow:auto;background:var(--ink);flex-direction:column;align-items:stretch;gap:0;padding:8px var(--gut) 24px;display:none;font-size:22px}
  .nav-open #menu{display:flex}
  #menu>li>a,.dd-btn{display:block;width:100%;text-align:left;padding:14px 0;border-bottom:1px solid #2c2b29}
  .dd-list{position:static;box-shadow:none;padding:0 0 8px 14px;min-width:0}
  .dd-list a{text-align:left;padding:8px 0;font-size:16px;color:#cfcdc6}
}

/* slides */
.slide{position:relative;height:100svh;min-height:520px;scroll-snap-align:start;padding-top:var(--bar);overflow:hidden;display:flex;flex-direction:column}
.sl-cover,.sl-div{background:var(--ink);color:#f3f2ee}
.sl-cover .kick,.sl-div .kick{color:var(--dim)}
.cover-in{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 var(--gut);max-width:1500px;width:100%;margin:0 auto}
.sl-cover h1{font:700 clamp(64px,13vw,220px)/.86 var(--display);letter-spacing:-.055em;margin:0}
.cover-role{font:400 clamp(14px,1.4vw,18px)/1.5 var(--display);color:#cfcdc6;margin:28px 0 0}
.cover-line{font-size:clamp(17px,1.6vw,22px);max-width:34em;margin:18px 0 0;color:#e7e5df}
.cover-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
.cover-strip{display:grid;grid-template-columns:repeat(8,1fr);height:clamp(70px,14vh,140px);gap:2px}
.cover-strip span{overflow:hidden;background:#1d1d1b}.cover-strip img{width:100%;height:100%;object-fit:cover;opacity:.85}
.cover-strip .miss img{display:none}
@media (max-width:700px){.cover-strip{grid-template-columns:repeat(4,1fr)}.cover-strip span:nth-child(n+5){display:none}}
.mail{font:400 clamp(20px,2.6vw,34px)/1.2 var(--display);text-decoration:none;border-bottom:2px solid currentColor;margin-right:12px;word-break:break-all}
.sl-contact .cover-role{max-width:44em}

.go{display:inline-flex;align-items:center;gap:10px;height:46px;padding:0 20px;border:0;cursor:pointer;background:var(--ink);color:#f6f5f2;font:700 12.5px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.go-inv{background:#f6f5f2;color:var(--ink)}
.go-ghost{background:none;color:inherit;box-shadow:inset 0 0 0 1px currentColor}
.go:hover span{transform:translateX(3px)}.go span{transition:transform .2s}

/* divider */
.div-in{flex:1;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px 48px;align-items:center;padding:0 var(--gut);max-width:1500px;width:100%;margin:0 auto}
.sl-div h2{font:700 clamp(48px,8vw,140px)/.9 var(--display);letter-spacing:-.05em;margin:0;grid-column:1}
.sl-div .kick{grid-column:1;align-self:end;margin:0}
.div-list{grid-column:2;grid-row:1/3;list-style:none;margin:0;padding:0;counter-reset:n;font:400 clamp(17px,1.7vw,24px)/1.2 var(--display)}
.div-list li{counter-increment:n;border-top:1px solid #2f2e2b}
.div-list a{display:flex;gap:14px;padding:11px 0;text-decoration:none}
.div-list a::before{content:counter(n,decimal-leading-zero);color:var(--dim);font-size:.6em;padding-top:.4em}
.div-list a:hover{padding-left:6px}
@media (max-width:760px){.div-in{grid-template-columns:minmax(0,1fr);align-content:center}.div-list{grid-column:1;grid-row:auto;font-size:16px}.div-list a{padding:7px 0}}

/* project slide: image collage + info band */
.sl-project{background:var(--paper)}
.col{flex:1;min-height:0;display:grid;gap:3px;background:var(--paper)}
.col-1{grid-template-columns:1fr}
.col-2{grid-template-columns:1.6fr 1fr}
.col-3{grid-template-columns:1.7fr 1fr;grid-template-rows:1fr 1fr}
.col-3 .tile:first-child{grid-row:1/3}
.tile,.full{position:relative;border:0;padding:0;margin:0;background:var(--panel);overflow:hidden;cursor:zoom-in;min-height:0;display:block;width:100%;height:100%}
.tile img,.full img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
.tile:hover img,.full:hover img{transform:scale(1.03)}
.tile .tag{position:absolute;left:12px;top:12px;background:rgba(12,12,11,.78);color:#f3f2ee}
.play{position:absolute;inset:auto auto 14px 14px;width:44px;height:44px;border-radius:50%;background:rgba(12,12,11,.8);color:#fff;display:grid;place-items:center;font-size:14px}
.fbk{position:absolute;inset:0;display:none;align-items:flex-end;padding:18px;background:#1b1b19;color:#f3f2ee;font:700 clamp(18px,2.2vw,34px)/1 var(--display);letter-spacing:-.03em;text-align:left}
.miss>img{display:none}.miss>.fbk{display:flex}
.full{flex:1}
.info{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px 24px;align-items:center;padding:16px var(--gut) 18px;background:var(--paper);border-top:1px solid var(--line)}
.info-dark{background:var(--ink);color:#f3f2ee;border-top-color:#2c2b29}.info-dark .kick{color:var(--dim)}.info-dark .meta{color:#bdbbb4}
.num{font:700 13px/1 var(--display);color:var(--mute);align-self:start;padding-top:2px;min-width:22px}
.info h2{font:700 clamp(24px,3.2vw,48px)/1 var(--display);letter-spacing:-.04em;margin:0}
.info .kick{margin-bottom:6px}
.meta{font:400 13px/1.4 var(--display);color:var(--mute);margin:8px 0 0}
@media (max-width:760px){
  .col-3{grid-template-columns:1fr 1fr;grid-template-rows:1.6fr 1fr}.col-3 .tile:first-child{grid-row:auto;grid-column:1/-1}
  .col-2{grid-template-columns:1fr;grid-template-rows:1.6fr 1fr}
  .info{grid-template-columns:minmax(0,1fr);gap:10px}.num{display:none}.go{justify-self:start}
}
.tag{font:700 9.5px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;padding:5px 7px;border:1px solid currentColor;white-space:nowrap;display:inline-block}

/* HUD */
.hud{position:fixed;right:var(--gut);bottom:14px;z-index:20;display:flex;align-items:center;gap:8px;font:400 12px/1 var(--display);color:var(--mute);pointer-events:none}
.hud>*{pointer-events:auto}
.hud button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
#hud-c{margin-right:6px}
.on-dark .hud{color:var(--dim)}.on-dark .hud button{background:var(--ink);color:#f3f2ee;border-color:#3b3a37}
@media (max-width:760px){.hud{display:none}}
.sl-project .info{padding-right:calc(var(--gut) + 200px)}
@media (max-width:760px){.sl-project .info{padding-right:var(--gut)}}

/* viewer */
dialog{border:0;padding:0;margin:0;max-width:100vw;max-height:100vh;width:100vw;height:100dvh;background:#0b0b0a;color:#f3f2ee}
dialog::backdrop{background:rgba(0,0,0,.7)}
.v{display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;height:100%}
.v-top{display:flex;align-items:center;gap:16px;padding:12px var(--gut);border-bottom:1px solid #222}
.v-top h2{font:700 17px/1 var(--display);letter-spacing:-.02em;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#v-sec{font:400 13px/1 var(--display);color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
#v-count{font:400 13px/1 var(--display);color:var(--dim)}
.vbtn{background:none;border:1px solid #3d3c39;color:#f3f2ee;min-width:44px;height:40px;border-radius:99px;cursor:pointer;font:400 14px/1 var(--display);padding:0 14px}
.vbtn:hover{border-color:#f3f2ee}.vbtn:disabled{opacity:.3;cursor:default}
.v-mid{position:relative;overflow:hidden;height:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;min-height:0}
.v-mid>.vbtn{margin:0 12px;height:56px;min-width:56px;font-size:20px}
#v-stage{height:100%;min-height:0;overflow:hidden;display:grid;grid-template-rows:minmax(0,1fr);place-items:center;padding:14px 0}
.v-fig{margin:0;width:100%;height:100%;min-height:0;overflow:hidden;display:grid;place-items:center;position:relative}
.v-fig img{width:100%;height:100%;object-fit:contain}
.v-fig video{max-width:100%;max-height:100%;width:auto;height:auto}
.v-fig video{max-height:calc(100dvh - 220px);background:#000}
.v-fig .fbk{position:static;display:none;height:60%;width:80%}.v-fig.miss .fbk{display:flex}
.v-cap{padding:6px var(--gut) 8px;font:400 13.5px/1.45 var(--display);color:#cfcdc6;text-align:center;min-height:30px}
.v-cap .tag{color:#9f9d96;margin-left:6px}
.v-sec-t{display:block;color:#9f9d96;max-width:60em;margin:4px auto 0;font-family:var(--text)}
#v-thumbs{display:flex;gap:4px;overflow-x:auto;padding:8px var(--gut) 12px;scrollbar-width:thin}
.th{flex:none;width:64px;height:46px;border:0;padding:0;background:#1b1b19;cursor:pointer;opacity:.5;position:relative;overflow:hidden}
.th img{width:100%;height:100%;object-fit:cover}.th.miss img{display:none}
.th[aria-current="true"],.th:hover{opacity:1;outline:2px solid #f3f2ee;outline-offset:-2px}
.th-i{font:700 15px/1 var(--display);color:#f3f2ee}
.v-intro{width:100%;height:100%;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:clamp(20px,3vw,48px);align-items:center;padding:0 var(--gut)}
.v-intro-img{height:100%;max-height:calc(100dvh - 220px);position:relative;background:#1b1b19;overflow:hidden}
.v-intro-img img{width:100%;height:100%;object-fit:contain}
.v-intro-txt h2{font:700 clamp(32px,4.4vw,72px)/.95 var(--display);letter-spacing:-.045em;margin:0 0 16px}
.v-intro-txt .kick{color:var(--dim)}
.v-lede{font-size:clamp(16px,1.3vw,19px);color:#e1dfd9;margin:0 0 20px;max-width:30em}
.v-intro-txt dl{margin:0 0 24px;display:grid;gap:10px;font:400 13.5px/1.4 var(--display)}
.v-intro-txt dt{font-weight:700;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.v-intro-txt dd{margin:2px 0 0}
.v-end{display:grid;justify-items:center;gap:18px;padding:0 var(--gut);width:100%}
.v-end .kick{color:var(--dim)}
.v-next{position:relative;border:0;padding:0;background:#1b1b19;cursor:pointer;width:min(70vw,900px);aspect-ratio:16/9;overflow:hidden}
.v-next img{width:100%;height:100%;object-fit:cover;opacity:.75;transition:opacity .3s}.v-next:hover img{opacity:1}
.v-next-t{position:absolute;left:20px;bottom:18px;font:700 clamp(22px,3vw,44px)/1 var(--display);letter-spacing:-.03em;text-shadow:0 2px 20px rgba(0,0,0,.6)}
@media (max-width:760px){#v-sec,.v-top [data-index]{display:none}.v-top{gap:10px}.v-top h2{flex:1;min-width:0}.v-mid{grid-template-columns:minmax(0,1fr)}.v-mid>.vbtn{display:none}.v-intro{grid-template-columns:minmax(0,1fr);overflow:auto;align-content:start;padding-block:8px}.v-intro-img{height:34vh}#v-stage{overflow:auto}}

/* index overlay */
#index{background:var(--paper);color:var(--ink)}
.i-top{display:flex;justify-content:space-between;align-items:center;padding:14px var(--gut);border-bottom:1px solid var(--line)}
.i-top h2{font:700 22px/1 var(--display);letter-spacing:-.03em;margin:0}
#i-close{border-color:var(--line);color:var(--ink)}
#index-body{padding:18px var(--gut) 40px;overflow:auto;height:calc(100% - 64px)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.chip{border:1px solid var(--line);background:none;padding:10px 15px;border-radius:99px;cursor:pointer;font:400 14px/1 var(--display)}
.chip span{color:var(--mute);margin-left:3px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}.chip[aria-pressed="true"] span{color:inherit;opacity:.6}
.idx{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:22px 14px}
.card{position:relative;border:0;padding:0;background:none;cursor:pointer;text-align:left;display:block}
.card img{width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--panel);transition:transform .6s}
.card:hover img{transform:scale(1.02)}
.card .fbk{inset:0 0 auto 0;aspect-ratio:4/3;height:auto}
.card-t{display:flex;justify-content:space-between;gap:10px;padding-top:8px;font:700 16px/1.2 var(--display);letter-spacing:-.01em}
.card-t small{font-weight:400;font-size:12px;color:var(--mute);text-align:right}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>
<header class="bar">
  <a class="brand" href="#s-home" data-goto="s-home">Nour Serhan</a>
  <div class="bar-r">
    <nav aria-label="Projects"><ul id="menu"></ul></nav>
    <button class="ibtn" data-index type="button">Index</button>
    <button class="ibtn" id="burger" type="button" aria-expanded="false" aria-controls="menu">Menu</button>
  </div>
</header>
<main id="deck"></main>
<div class="hud" aria-label="Slide navigation"><span id="hud-c"></span><span id="hud-n"></span><button id="hud-prev" type="button" aria-label="Previous slide">↑</button><button id="hud-next" type="button" aria-label="Next slide">↓</button></div>

<dialog id="viewer" aria-label="Project viewer">
  <div class="v">
    <div class="v-top"><h2 id="v-title"></h2><span id="v-sec"></span><span id="v-count"></span><button class="vbtn" data-index type="button">Index</button><button class="vbtn" id="v-close" type="button" aria-label="Close project">Close ✕</button></div>
    <div class="v-mid"><button class="vbtn" id="v-prev" type="button" aria-label="Previous">←</button><div id="v-stage" aria-live="polite"></div><button class="vbtn" id="v-next" type="button" aria-label="Next">→</button></div>
    <div class="v-cap" id="v-cap"></div>
    <div id="v-thumbs" aria-label="All images"></div>
  </div>
</dialog>
<dialog id="index" aria-label="All projects"><div class="i-top"><h2>All projects</h2><button class="vbtn" id="i-close" type="button">Close ✕</button></div><div id="index-body"></div></dialog>

<script>

/*DATA*/
/*APP*/
</script>
</body>
</html>
