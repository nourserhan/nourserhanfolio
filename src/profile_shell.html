<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nour Serhan · Branding Profile</title>
<style>
/* A4 landscape, 8 pages. Open in Chrome or Safari, then File → Print → Save as PDF (margins: none, background graphics: on). */
@font-face{font-family:"Adventor";src:url(a/fonts/adventor-regular.woff) format("woff");font-weight:400}
@font-face{font-family:"Adventor";src:url(a/fonts/adventor-bold.woff) format("woff");font-weight:700}
@font-face{font-family:"Lora";src:url(a/fonts/lora.woff) format("woff");font-weight:400 700}
@font-face{font-family:"Lora";src:url(a/fonts/lora-italic.woff) format("woff");font-weight:400 700;font-style:italic}
@page{size:297mm 210mm;margin:0}
:root{--paper:#f7f6f3;--ink:#0d0d0c;--mute:#5c5b57;--line:#d6d4ce;--d:"Adventor","Century Gothic",sans-serif;--t:"Lora",Georgia,serif}
*{box-sizing:border-box}
html,body{margin:0;background:#bdbcb7;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.page{width:297mm;height:210mm;margin:10mm auto;background:var(--paper);color:var(--ink);position:relative;overflow:hidden;padding:14mm 16mm;font:400 10.5pt/1.5 var(--t);page-break-after:always;break-after:page;display:grid}
.page.inv{background:var(--ink);color:var(--paper)}
@media print{html,body{background:none}.page{margin:0;box-shadow:none}.hint{display:none}}
@media screen{.page{box-shadow:0 6px 30px rgba(0,0,0,.18)}}
.hint{max-width:297mm;margin:10mm auto 0;font:400 13px/1.5 var(--d);color:#222;background:#fff;padding:12px 16px}
img{display:block;max-width:100%}
.eb{font:700 7.5pt/1.2 var(--d);letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin:0 0 4mm}
.inv .eb{color:#a9a7a0}
.disp{font:700 54pt/.9 var(--d);letter-spacing:-.045em;margin:0}
.h{font:700 24pt/1 var(--d);letter-spacing:-.035em;margin:0 0 5mm}
.h3{font:700 12.5pt/1.15 var(--d);letter-spacing:-.015em;margin:0 0 2mm}
.lead{font-size:13pt;line-height:1.45;margin:0}
p{margin:0 0 3mm}
.mute{color:var(--mute)}
.inv .mute{color:#a9a7a0}
.folio{position:absolute;left:16mm;right:16mm;bottom:8mm;display:flex;justify-content:space-between;font:400 7.5pt/1 var(--d);color:var(--mute)}
.inv .folio{color:#8d8b85}
.rule{border-top:1px solid currentColor;padding-top:3mm}
.cap{font:400 7pt/1.35 var(--d);color:var(--mute);margin-top:1.5mm;display:flex;justify-content:space-between;gap:3mm}
.cap b{font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:6pt;white-space:nowrap}
.im{background:#e7e6e1;overflow:hidden;position:relative}
.im img{width:100%;height:100%;object-fit:cover}
.im img[src$="p5.jpg"],.im img[src$="p19.jpg"]{object-position:right center}
.im .fb{display:none;position:absolute;inset:0;background:var(--ink);color:var(--paper);font:700 16pt/1 var(--d);letter-spacing:-.03em;padding:4mm;align-items:flex-end}
.im.miss img{display:none}.im.miss .fb{display:flex}
.chips{display:flex;flex-wrap:wrap;gap:2mm;margin-top:4mm}
.chips span{font:400 8pt/1 var(--d);border:1px solid currentColor;padding:1.6mm 2.6mm;border-radius:20mm}
.meta{font:400 8.5pt/1.45 var(--d)}
.meta dt{font-weight:700;font-size:6.5pt;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.meta dd{margin:0 0 2.5mm}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:6mm;border-top:1px solid currentColor;padding-top:2.5mm}.ph .eb{margin:0}.pt{font:700 15pt/1.1 var(--d);letter-spacing:-.025em;text-align:right}.cell{min-width:0}
</style>
</head>
<body>
